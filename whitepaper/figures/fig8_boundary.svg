<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 900 300" width="900" height="300" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b645d"/></marker><marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b8292f"/></marker></defs><rect width="900" height="300" fill="#fff"/><rect x="20" y="30" width="390" height="240" rx="14" fill="#fbeeee" stroke="#b8292f" stroke-width="2"/><text x="215" y="58" font-size="15" fill="#b8292f" font-weight="700" text-anchor="middle" dominant-baseline="middle">链上（BOT Chain，公开、不可删）</text><text x="42" y="95" font-size="12.5" fill="#2a2622" font-weight="400" text-anchor="start" dominant-baseline="middle">· 学者标识：keccak256("openalex:作者编号")</text><text x="42" y="129" font-size="12.5" fill="#2a2622" font-weight="400" text-anchor="start" dominant-baseline="middle">· 评分：数值 + 快照指纹 + 规则版本</text><text x="42" y="163" font-size="12.5" fill="#2a2622" font-weight="400" text-anchor="start" dominant-baseline="middle">· 认领凭证指纹（CLAIM）</text><text x="42" y="197" font-size="12.5" fill="#2a2622" font-weight="400" text-anchor="start" dominant-baseline="middle">· 稿件指纹（SUBMIT）· 结案（CLOSE）</text><text x="42" y="231" font-size="12.5" fill="#2a2622" font-weight="400" text-anchor="start" dominant-baseline="middle">· 廌点流水：原因编号 + 证据指纹</text><rect x="490" y="30" width="390" height="240" rx="14" fill="#f7f4ef" stroke="#ddd6ca" stroke-width="2"/><text x="685" y="58" font-size="15" fill="#2a2622" font-weight="700" text-anchor="middle" dominant-baseline="middle">链下（不上链）</text><text x="512" y="95" font-size="12.5" fill="#2a2622" font-weight="400" text-anchor="start" dominant-baseline="middle">· 姓名、单位、论文元数据（公开数据源）</text><text x="512" y="129" font-size="12.5" fill="#2a2622" font-weight="400" text-anchor="start" dominant-baseline="middle">· 认领凭证原文、稿件原文</text><text x="512" y="163" font-size="12.5" fill="#2a2622" font-weight="400" text-anchor="start" dominant-baseline="middle">· 邮箱：只在凭证里存哈希</text><text x="512" y="197" font-size="12.5" fill="#2a2622" font-weight="400" text-anchor="start" dominant-baseline="middle">· 研究材料：服务端权限保护</text><text x="512" y="231" font-size="12.5" fill="#2f7d5b" font-weight="600" text-anchor="start" dominant-baseline="middle">· 任何人可拿原文重算指纹核对</text><line x1="488" y1="231" x2="412" y2="231" stroke="#2f7d5b" stroke-width="1.8" marker-end="url(#arr)"/><text x="450" y="212" font-size="12" fill="#2f7d5b" font-weight="600" text-anchor="middle" dominant-baseline="middle">重算</text><text x="450" y="252" font-size="12" fill="#2f7d5b" font-weight="600" text-anchor="middle" dominant-baseline="middle">核对</text></svg>