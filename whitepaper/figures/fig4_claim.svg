<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 900 300" width="900" height="300" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b645d"/></marker><marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b8292f"/></marker></defs><rect width="900" height="300" fill="#fff"/><rect x="25" y="40" width="196" height="110" rx="12" fill="#f7f4ef" stroke="#ddd6ca" stroke-width="1.6"/><text x="123" y="72" font-size="16" fill="#2a2622" font-weight="700" text-anchor="middle" dominant-baseline="middle">① 逐篇确认</text><text x="123" y="102" font-size="12" fill="#2a2622" font-weight="400" text-anchor="middle" dominant-baseline="middle">是我的 / 不是我的 / 不确定</text><text x="123" y="126" font-size="11.5" fill="#6b645d" font-weight="400" text-anchor="middle" dominant-baseline="middle">默认「不确定」</text><line x1="222" y1="95" x2="241" y2="95" stroke="#6b645d" stroke-width="1.8" marker-end="url(#arr)"/><rect x="243" y="40" width="196" height="110" rx="12" fill="#f7f4ef" stroke="#ddd6ca" stroke-width="1.6"/><text x="341" y="72" font-size="16" fill="#2a2622" font-weight="700" text-anchor="middle" dominant-baseline="middle">② 邮箱验证</text><text x="341" y="102" font-size="12" fill="#2a2622" font-weight="400" text-anchor="middle" dominant-baseline="middle">6 位码 · 10 分钟 · 5 次</text><text x="341" y="126" font-size="11.5" fill="#6b645d" font-weight="400" text-anchor="middle" dominant-baseline="middle">单位邮箱核对（演示模式）</text><line x1="440" y1="95" x2="459" y2="95" stroke="#6b645d" stroke-width="1.8" marker-end="url(#arr)"/><rect x="461" y="40" width="196" height="110" rx="12" fill="#f7f4ef" stroke="#ddd6ca" stroke-width="1.6"/><text x="559" y="72" font-size="16" fill="#2a2622" font-weight="700" text-anchor="middle" dominant-baseline="middle">③ 认领凭证</text><text x="559" y="102" font-size="12" fill="#2a2622" font-weight="400" text-anchor="middle" dominant-baseline="middle">档案 · 论文 · 学术分 · 时间</text><text x="559" y="126" font-size="11.5" fill="#6b645d" font-weight="400" text-anchor="middle" dominant-baseline="middle">邮箱只存哈希</text><line x1="658" y1="95" x2="677" y2="95" stroke="#6b645d" stroke-width="1.8" marker-end="url(#arr)"/><rect x="679" y="40" width="196" height="110" rx="12" fill="#fbeeee" stroke="#b8292f" stroke-width="1.6"/><text x="777" y="72" font-size="16" fill="#b8292f" font-weight="700" text-anchor="middle" dominant-baseline="middle">④ 写入链上</text><text x="777" y="102" font-size="12" fill="#2a2622" font-weight="400" text-anchor="middle" dominant-baseline="middle">CLAIM 凭证指纹 + SCORE</text><text x="777" y="126" font-size="11.5" fill="#6b645d" font-weight="400" text-anchor="middle" dominant-baseline="middle">红章 / 灰章「待复核」</text><rect x="250" y="200" width="400" height="70" rx="12" fill="#fff" stroke="#2f7d5b" stroke-width="1.8"/><text x="450" y="224" font-size="13" fill="#2a2622" font-weight="600" text-anchor="middle" dominant-baseline="middle">复核：任何人提交凭证原文 → 重算指纹 → 与链上 CLAIM 比对</text><text x="450" y="250" font-size="13" fill="#2f7d5b" font-weight="600" text-anchor="middle" dominant-baseline="middle">一致 ✓　|　凭证任一字段被改 → 不一致 ✗</text><line x1="775" y1="152" x2="655" y2="222" stroke="#2f7d5b" stroke-width="1.8" marker-end="url(#arr)"/></svg>