"34" rx="6" fill="#b8292f"/><text x="585" y="111" font-size="13" fill="#fff" font-weight="700" text-anchor="middle" dominant-baseline="middle">优秀</text><text x="684" y="111" font-size="13" fill="#2a2622" font-weight="600" text-anchor="start" dominant-baseline="middle">750–829</text><text x="770" y="111" font-size="12.5" fill="#6b645d" font-weight="400" text-anchor="start" dominant-baseline="middle">可接审稿</text><rect x="500" y="136" width="170" height="34" rx="6" fill="#c9555a"/><text x="585" y="153" font-size="13" fill="#fff" font-weight="700" text-anchor="middle" dominant-baseline="middle">良好</text><text x="684" y="153" font-size="13" fill="#2a2622" font-weight="600" text-anchor="start" dominant-baseline="middle">680–749</text><text x="770" y="153" font-size="12.5" fill="#6b645d" font-weight="400" text-anchor="start" dominant-baseline="middle">投稿免费</text><rect x="500" y="178" width="170" height="34" rx="6" fill="#d9a441"/><text x="585" y="195" font-size="13" fill="#fff" font-weight="700" text-anchor="middle" dominant-baseline="middle">中等 · 证据不足</text><text x="684" y="195" font-size="13" fill="#2a2622" font-weight="600" text-anchor="start" dominant-baseline="middle">600–679</text><text x="770" y="195" font-size="12.5" fill="#6b645d" font-weight="400" text-anchor="start" dominant-baseline="middle">新人默认</text><rect x="500" y="220" width="170" height="34" rx="6" fill="#bcae9a"/><text x="585" y="237" font-size="13" fill="#fff" font-weight="700" text-anchor="middle" dominant-baseline="middle">一般</text><text x="684" y="237" font-size="13" fill="#2a2622" font-weight="600" text-anchor="start" dominant-baseline="middle">500–599</text><text x="770" y="237" font-size="12.5" fill="#6b645d" font-weight="400" text-anchor="start" dominant-baseline="middle">押 10 廌点</text><rect x="500" y="262" width="170" height="34" rx="6" fill="#9b8f84"/><text x="585" y="279" font-size="13" fill="#fff" font-weight="700" text-anchor="middle" dominant-baseline="middle">待提升</text><text x="684" y="279" font-size="13" fill="#2a2622" font-weight="600" text-anchor="start" dominant-baseline="middle">350–499</text><text x="770" y="279" font-size="12.5" fill="#6b645d" font-weight="400" text-anchor="start" dominant-baseline="middle">押 20 + 交 10</text><text x="450" y="318" font-size="12" fill="#6b645d" font-weight="400" text-anchor="middle" dominant-baseline="middle">学术分 = 350 + 6 × round(100 × 综合 × 撤稿平衡)；论文少向中性收缩 w = n/(n+10)；廌点余额不进公式</text></svg>